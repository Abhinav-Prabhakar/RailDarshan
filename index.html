<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rail Darshan — Indian Railways in Light</title>
  <meta name="description" content="A photoreal, interactive study of Indian Railways — locomotives, carriages, interiors, sound and light." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..700&family=IBM+Plex+Mono:wght@300;400;500&family=Manrope:wght@200..800&family=Noto+Sans+Devanagari:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="ui"></div>
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-mark">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="0.6" opacity=".35"/>
          <circle cx="32" cy="32" r="23" stroke="currentColor" stroke-width="0.6" opacity=".5"/>
          <path d="M14 40h36M20 40V26l8-6 8 6v14" stroke="currentColor" stroke-width="1"/>
          <path d="M28 33h8M28 37h8" stroke="currentColor" stroke-width=".7"/>
        </svg>
      </div>
      <p class="loader-kicker">भारतीय रेल · A PHOTOREAL STUDY</p>
      <h1>Rail&nbsp;Darshan</h1>
      <p class="loader-sub">Steel, steam and the last light of an Indian evening.</p>
      <div class="loader-bar"><i></i></div>
      <p class="loader-status">Preparing the platform…</p>
    </div>
  </div>
  <noscript><div style="padding:2rem;color:#fff">This experience needs JavaScript and WebGL.</div></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
